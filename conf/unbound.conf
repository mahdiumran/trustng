# TRUST-NG unbound configuration
# Basis: backup-unbound/unbound.conf (produksi dnstrust) + patch filterdb
# Perubahan dari produksi:
#   - bloomfilter-* dihapus (fitur binary patched lain, bukan bagian patch kita)
#   - cache discale 1/4 utk box dev (~330MB): msg 64m rrset 160m key 64m neg 30m
#   - username: unbound (konsisten paket Debian; produksi memakai 'daemon')
#   - control-use-cert: no (unbound-control lokal tanpa sertifikat)
#   - stat-interval: 0 -> timer 1 detik tetap jalan untuk hot-remap CDB
remote-control:
	control-enable: yes
	control-interface: "/etc/unbound/run/unbound.sock"
	control-use-cert: no

server:
	do-ip6: yes
	chroot: ""
	directory: "/etc/unbound"
	filter-database: /etc/unbound/db/blacklist.db
	verbosity: 0
	udp-connect: no
	so-rcvbuf: 4m
	so-sndbuf: 4m
	cache-min-ttl: 0
	cache-max-ttl: 31536000
	msg-cache-size: 64m
	msg-cache-slabs: 8
	rrset-cache-size: 160m
	rrset-cache-slabs: 8
	key-cache-size: 64m
	key-cache-slabs: 8
	neg-cache-size: 30m
	infra-cache-numhosts: 100000
	infra-cache-slabs: 8
	delay-close: 1500
	jostle-timeout: 50
	serve-expired-client-timeout: 1800
	discard-timeout: 0
	unknown-server-time-limit: 10
	answer-cookie: yes
	cookie-secret: 035a763be470824d8b490a1646f9df83
	port: 53
	interface-automatic: yes
	ip-transparent: yes
        access-control: 0.0.0.0/0 allow_setrd
	access-control: ::/0 allow_setrd
	do-daemonize: no
	num-threads: 4
	low-rtt-pct: 900
	outgoing-port-permit: 1025-65535
	outgoing-port-avoid: 7587
	outgoing-port-avoid: 40080
	outgoing-port-avoid: 40443
	outgoing-port-avoid: 56646
	outgoing-range: 131072
	num-queries-per-thread: 16384
	outgoing-num-tcp: 1024
	incoming-num-tcp: 1024
	outgoing-tcp-mss: 1196
	rrset-roundrobin: yes
	fast-server-permil: 900
	minimal-responses: yes
	qname-minimisation: yes
	username: "unbound"
	use-syslog: no
	logfile: "/etc/unbound/run/unbound.log"
	auto-trust-anchor-file: "/etc/unbound/key/root.key"
	#val-permissive-mode: yes
	pidfile: "/etc/unbound/run/unbound.pid"
	hide-identity: yes
	hide-version: yes
	serve-expired: yes
	ede: yes
	ede-serve-expired: yes
	prefetch: yes
	prefetch-key: yes
	private-address: 10.0.0.0/8
	private-address: 172.16.0.0/12
	private-address: 192.168.0.0/16
	private-address: 169.254.0.0/16
	private-address: fd00::/8
	private-address: fe80::/10
	do-not-query-address: 127.0.0.0/8
	do-not-query-address: ::1
	do-not-query-localhost: yes
	so-reuseport: yes
	harden-short-bufsize: yes
	harden-large-queries: yes
	harden-glue: yes
	harden-dnssec-stripped: yes
	harden-below-nxdomain: yes
	harden-referral-path: no
	disable-dnssec-lame-check: yes
	deny-any: yes
	local-zone: "use-application-dns.net." always_nxdomain
	local-zone: 1.1.1.in-addr.arpa always_transparent
	local-zone: 0.0.1.in-addr.arpa always_transparent
	local-zone: local. static
	local-zone: invalid. static
	local-zone: intra. static
	local-zone: internal. static
	local-zone: intranet. static
	local-zone: loc. static
	local-zone: "blacklist." blacklist
	local-data: "blacklist. 10800 IN NS nobody.blacklist."
	local-data: "blacklist. 10800 IN SOA blacklist. nobody.invalid. 1 3600 1200 604800 10800"
	include: /etc/unbound/lamanlabuh.conf
	local-data: "blacklist. 60 IN HINFO 'BLOCKED' 'UU No 19, pasal 40 (2a dan 2b). Permen Kominfo No 5 2020'"
	local-data: "blacklist. 60 IN TXT 'BLOCKED. UU No 19, pasal 40 (2a dan 2b). Permen Kominfo No 5 2020'"
	include: /etc/unbound/whitelist.conf
	include: /etc/unbound/refuse-any.conf
